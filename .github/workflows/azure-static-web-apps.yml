name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      # Until the deployment token is added as a repo secret, skip rather than
      # fail, so pushes to main don't go red before the Azure resource exists.
      - name: Check for deployment token
        id: token
        run: |
          if [ -z "$AZURE_TOKEN" ]; then
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; skipping Azure deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Test
        if: steps.token.outputs.present == 'true'
        run: npm test

      # Static Web Apps serves from the domain root, unlike the Pages sub-path.
      - name: Build
        if: steps.token.outputs.present == 'true'
        run: npm run build
        env:
          VITE_BASE: /

      # Built above so tests run and VITE_BASE applies; the action only uploads.
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
